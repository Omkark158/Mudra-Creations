<!-- ============ VIDEO LIGHTBOX ============ -->
<div class="video-modal" id="video-modal">
  <div class="video-modal-inner">
    <button class="video-modal-close" id="video-modal-close" aria-label="Close video">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <video id="video-modal-player" playsinline controls></video>
  </div>
</div>

<script src="script.js"></script>
<script>
(function () {
  "use strict";

  /* ==============================================================
     EDIT ME: this is the full list of speed ramp videos.
     `file` must exactly match the filename in your assets folder
     (same spelling/capitalization/spaces, and the right extension —
     these are assumed to be .mp4, change if yours differ).
     Add, remove, rename or reorder entries freely.
     `title` is kept for the aria-label (accessibility) only —
     it is no longer shown on the card.
  ============================================================== */
  var videos = [
    { title: "Shubham Dining Final", file: "assets/Shubham Dining Final.mp4" },
    { title: "Tea Stall Edit",       file: "assets/Teastalledit.mp4" },
    { title: "SD Maharashtriya Final", file: "assets/SD Maharashtriya Final.mp4" },
    { title: "Paithani Final",       file: "assets/Paithani Final.mp4" },
    { title: "Jamadar Dairy Final",  file: "assets/Jamadar Dairy Final.mp4" },
    { title: "Adik Sir Bullet 2",    file: "assets/Adik Sir Bullet 2.mp4" },
    { title: "Bullet Final",         file: "assets/Bullet Final.mp4" },
    { title: "Road Cons Final",      file: "assets/Road Cons final.mp4" }
  ];

  var grid = document.getElementById("speedramp-grid");
  var modal = document.getElementById("video-modal");
  var modalPlayer = document.getElementById("video-modal-player");
  var modalClose = document.getElementById("video-modal-close");

  videos.forEach(function (v, i) {
    var card = document.createElement("button");
    card.type = "button";
    card.className = "gallery-card";
    card.setAttribute("aria-label", "Play " + v.title);
    card.innerHTML =
      '<video src="' + v.file + '" muted loop playsinline preload="metadata"></video>' +
      '<div class="gallery-card-play">' +
        '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>' +
      '</div>';

    var previewVideo = card.querySelector("video");
    card.addEventListener("mouseenter", function () { previewVideo.play().catch(function(){}); });
    card.addEventListener("mouseleave", function () { previewVideo.pause(); });

    card.addEventListener("click", function () {
      openModal(v.file);
    });

    grid.appendChild(card);
  });

  function openModal(src) {
    modalPlayer.src = src;
    modal.classList.add("open");
    document.body.classList.add("lock");
    modalPlayer.currentTime = 0;
    modalPlayer.play().catch(function(){});
  }

  function closeModal() {
    modal.classList.remove("open");
    document.body.classList.remove("lock");
    modalPlayer.pause();
    modalPlayer.src = "";
  }

  modalClose.addEventListener("click", closeModal);
  modal.addEventListener("click", function (e) {
    if (e.target === modal) closeModal();
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") closeModal();
  });
})();
</script>
</body>
</html>
